<!DOCTYPE html>
<html lang="it">
<head>
  <!-- ========================================== -->
  <!-- BLOCCO 1: CSS (LAYOUT DASHBOARD A TAB)     -->
  <!-- ========================================== -->
  <meta charset="UTF-8">
  <title>Ud'A - Pannello Admin</title>
  <style>
    :root {
      --sidebar: #0f172a; --bg: #f1f5f9; --card: #ffffff; 
      --text: #334155; --border: #e2e8f0; --accent: #3b82f6;
      --ok: #10b981; --ko: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); }
    .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; }
    .logo-area { padding: 20px; background: #020617; border-bottom: 1px solid #1e293b; text-align: center; }
    .nav-item { padding: 14px 24px; font-size: 13px; font-weight: 600; cursor: pointer; border-left: 3px solid transparent; }
    .nav-item:hover, .nav-item.active { background: #1e293b; color: white; border-left-color: var(--accent); }
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .header-bar { background: var(--card); padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .tab-content { padding: 24px; display: none; }
    .tab-content.active { display: block; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .upload-box { border: 2px dashed #94a3b8; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; display: block; }
    input[type="file"] { display: none; }
    .btn { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: #f8fafc; padding: 12px; border-bottom: 2px solid var(--border); }
    td { padding: 12px; border-bottom: 1px solid var(--border); }
    .action-links span { color: var(--accent); cursor: pointer; font-weight: 600; margin-right: 10px; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo-area"><h1>SUPER ADMIN</h1><p>Gestione Dati Ud'A</p></div>
  <div class="nav-item active" onclick="switchTab('tab-stu', this)">👥 Importazione Studenti</div>
  <div class="nav-item" onclick="switchTab('tab-log', this)">📝 Log Override</div>
</div>

<div class="main-content">
  <div class="header-bar"><h2 id="pageTitle">Importazione Studenti</h2></div>

  <!-- ========================================== -->
  <!-- BLOCCO 2: TAB ANAGRAFICA E IMPORT CSV      -->
  <!-- ========================================== -->
  <div id="tab-stu" class="tab-content active">
    <div class="panel">
      <h3>Importa File Segreteria</h3>
      <label class="upload-box" id="drop-zone">
        <strong>Clicca per caricare CSV</strong>
        <input type="file" accept=".csv" onchange="gestisciFileCSV(event)">
      </label>
    </div>
    <div class="panel">
      <h3>Elenco Studenti <button class="btn" style="float:right;">📧 Invia Credenziali</button></h3>
      <table>
        <thead><tr><th>Matricola</th><th>Studente</th><th>Coorte</th><th>Stato</th></tr></thead>
        <tbody id="listaStudenti"><tr><td colspan="4">In attesa di file...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- BLOCCO 3: TAB LOG E OVERRIDE               -->
  <!-- ========================================== -->
  <div id="tab-log" class="tab-content">
    <div class="panel">
      <h3>Audit Timbrature</h3>
      <table>
        <thead><tr><th>Matr.</th><th>Docente</th><th>Reparto</th><th>Ore/Ruolo</th><th>Azioni</th></tr></thead>
        <tbody>
          <tr><td>3201456</td><td>Prof. Rossi</td><td>Conservativa</td><td>4h TPV</td><td class="action-links"><span onclick="alert('Modifica')">Modifica</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ========================================== 
  // SEZIONE 1: LOGICA INTERFACCIA E MOCK
  // ========================================== 
  function switchTab(id, el) {
    document.querySelectorAll('.tab-content, .nav-item').forEach(e => e.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    document.getElementById('pageTitle').innerText = el.innerText.substring(3);
  }

  function gestisciFileCSV(event) {
    const file = event.target.files[0];
    if(!file) return;
    document.getElementById('drop-zone').innerHTML = `<strong style="color:green;">✅ ${file.name} Caricato</strong>`;
    
    // In produzione qui andrà la logica per inviare i dati all'API Supabase 'studenti'
    const tbody = document.getElementById("listaStudenti");
    tbody.innerHTML = `<tr><td>3201456</td><td>Rossi M.</td><td>2023/24</td><td>In attesa</td></tr>`;
  }
</script>
</body>
</html>
